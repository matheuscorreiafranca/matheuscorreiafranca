<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Core engineering domains</title><desc id="desc">Three cards describing enterprise systems, integration and automation, and data and operations.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="260"><stop stop-color="#071426"/><stop offset="1" stop-color="#11183D"/></linearGradient><linearGradient id="line" x1="52" y1="35" x2="1220" y2="230"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
  <rect width="1280" height="260" rx="20" fill="url(#bg)"/><path d="M80 50H1200" stroke="url(#line)" stroke-opacity=".16"/><path d="M80 211H1200" stroke="url(#line)" stroke-opacity=".16"/>
  <g transform="translate(36 34)"><rect width="386" height="192" rx="16" fill="#0B1B31" stroke="#22D3EE" stroke-opacity=".28"/><circle cx="47" cy="48" r="22" fill="#0D3145"/><path d="M36 55V42L47 35L58 42V55L47 62L36 55Z" stroke="#67E8F9" stroke-width="2"/><text x="82" y="45" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Enterprise systems</text><text x="82" y="68" fill="#67E8F9" font-family="Segoe UI, Arial" font-size="12" font-weight="600" letter-spacing="1">ARCHITECTURE · APIS · ERP</text><text x="28" y="111" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">Business rules, modular applications,</text><text x="28" y="135" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">secure APIs and full-cycle ownership</text><text x="28" y="159" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">from design through production.</text></g>
  <g transform="translate(447 34)"><rect width="386" height="192" rx="16" fill="#0C1A38" stroke="#3B82F6" stroke-opacity=".3"/><circle cx="47" cy="48" r="22" fill="#102A55"/><path d="M35 48H59M47 36V60M39 40L55 56M55 40L39 56" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/><text x="82" y="45" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Integration &amp; automation</text><text x="82" y="68" fill="#93C5FD" font-family="Segoe UI, Arial" font-size="12" font-weight="600" letter-spacing="1">WORKFLOWS · JOBS · PLATFORMS</text><text x="28" y="111" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">REST and SOAP integrations, queues,</text><text x="28" y="135" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">scheduled processing and automation</text><text x="28" y="159" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">that removes operational friction.</text></g>
  <g transform="translate(858 34)"><rect width="386" height="192" rx="16" fill="#121737" stroke="#8B5CF6" stroke-opacity=".34"/><circle cx="47" cy="48" r="22" fill="#241D56"/><path d="M35 58V48M47 58V38M59 58V44" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/><text x="82" y="45" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Data &amp; operations</text><text x="82" y="68" fill="#C4B5FD" font-family="Segoe UI, Arial" font-size="12" font-weight="600" letter-spacing="1">SQL · BI · INFRASTRUCTURE</text><text x="28" y="111" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">Data models, query optimization, BI,</text><text x="28" y="135" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">observability, server administration</text><text x="28" y="159" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="14">and production incident response.</text></g>
</svg>
